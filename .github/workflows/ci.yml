name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No `continue-on-error` and no conditional skips anywhere in this file. Plan gate H2: a job that
# cannot do its work must fail, never pass silently.
# No workflow-level `concurrency`. It was tried with cancel-in-progress, to stop superseded runs of
# the fast jobs piling up, and it cancelled the whole run — the e2e job included, twice, at 13 and
# at 2 minutes. A job-level group does not protect against that: cancelling a run cancels its jobs.
# The fast jobs take well under a minute, so there is nothing worth cancelling; the e2e job has its
# own group below to keep its runs from overlapping.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.94.0 to match logos-execution-zone v0.2.4.
      # crates/basecamp-ffi depends on the LEZ wallet, which links pcsc-sys (smartcard support) and
      # needs libpcsclite at build time. Adding that crate to the workspace put it inside
      # `cargo clippy --workspace`, and this job started failing on a library it had never needed.
      - name: Install libpcsclite (the wallet links pcsc-sys)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # The guest tests run real zkVM sessions, so the prover must actually be present. Without it
      # every negative test still passes — "prover not found" is an Err just like a guest rejection —
      # which is precisely the hollow green this project exists to avoid.
      # rzup resolves releases through api.github.com. Unauthenticated, a shared runner shares the
      # 60-requests-an-hour pool with everyone else on that IP, and the job dies on "API rate limit
      # exceeded" having compiled nothing. GITHUB_TOKEN lifts it to 1,000/hour for this repo.
      - name: Install risc0 toolchain (r0vm)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.6
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.6

      - name: Verify the prover is present
        run: |
          r0vm --version
          test -s artifacts/membership.bin

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  dev-mode-clobber:
    name: RISC0_DEV_MODE clobber check (H3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-dev-mode-clobber.sh
        run: ./scripts/check-dev-mode-clobber.sh

  # Deliberately NOT path-filtered. Plan gate H4 is specifically about the gap #125 was pulled up
  # on: an e2e that runs on cron, or behind path filters that let a program change through
  # unexercised. A filter would have to enumerate everything behaviour-bearing — the programs, the
  # core crates, the committed guest binaries, Cargo.lock, the toolchain pin — and the first thing
  # anyone forgets to list is the thing that breaks. Running it on every push to main costs CI time
  # (free for a public repo) and cannot skip.
  e2e-sequencer:
    name: e2e against a real standalone LEZ sequencer
    runs-on: ubuntu-latest
    # This job builds LEZ and SPEL and then generates real proofs, so it runs for the better part of
    # an hour. Its own group, without cancellation, so overlapping pushes queue rather than kill it.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: false
    # A real proof on a 4-core runner is far slower than the ~19 min measured on an 8-core laptop.
    # Generous, but still well under GitHub's 6 h ceiling, so a hang fails rather than hanging.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Building LEZ and SPEL alongside this workspace does not fit comfortably in the ~14 GB a
      # standard runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      # The LEZ wallet links pcsc-sys (smartcard support), which needs libpcsclite at build time.
      # Without it the run gets as far as a live sequencer producing blocks and then dies at
      # "the LEZ wallet failed to build", 33 minutes in.
      - name: Install LEZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libpcsclite-dev

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      # Same rate limit as the job above, same fix.
      - name: Install risc0 toolchain (r0vm + the guest Rust toolchain)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install r0vm 3.0.6
          "$HOME/.risc0/bin/rzup" install cargo-risczero 3.0.6
          # build-guests.sh cross-compiles with RUSTUP_TOOLCHAIN=risc0. Installing r0vm alone gives
          # a prover but no guest toolchain, and the first run failed here with "override toolchain
          # 'risc0' is not installed" — after twelve minutes of building the sequencer.
          "$HOME/.risc0/bin/rzup" install rust
          rustup toolchain list

      # H2/H3: the prover must be present and dev mode must be off. A run that quietly proved
      # nothing would be worse than no run at all — RISC0_DEV_MODE=1 produces a receipt that
      # verifies and means nothing.
      - name: Verify the prover is present and dev mode is off
        run: |
          r0vm --version
          jq --version
          test "${RISC0_DEV_MODE:-0}" = "0"

      # Clones and builds LEZ v0.2.4 and the pinned SPEL itself, starts the sequencer, then runs
      # create → propose → approve to full M → execute with real proofs. No skip path: a missing
      # prerequisite exits non-zero (H2).
      - name: e2e-local-sequencer.sh
        env:
          RISC0_DEV_MODE: "0"
        run: ./scripts/e2e-local-sequencer.sh

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-run-logs
          path: .e2e/run/
          if-no-files-found: warn
          retention-days: 14

  guests-fresh:
    name: committed guest binaries match their sources
    runs-on: ubuntu-latest
    steps:
      # Needs full history: the check compares the newest commit touching each binary against the
      # newest commit touching its sources, and a shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-guests-fresh.sh
        run: ./scripts/check-guests-fresh.sh

  idl-flags:
    name: script flags match the IDL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-idl-flags.sh
        run: ./scripts/check-idl-flags.sh

  links:
    name: every relative Markdown link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-links.sh
        run: ./scripts/check-links.sh

  explorer-links:
    name: evidence URLs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # W2. Until Phase G deploys something there is no docs/DEPLOYMENT.md and the script says so
      # loudly and exits 0 — it reports "nothing to check", never "checks passed". Wired now rather
      # than at submission time because that is precisely when it would be forgotten, and when it
      # matters most: the testnet is wiped periodically, so evidence links rot on their own.
      # Preflight PF-09/PF-10 stay PENDING meanwhile, so a green job here cannot be mistaken for
      # readiness.
      # Exit 75 means every transaction is on the chain but the explorer has not indexed it yet —
      # which is the ordinary state for minutes to hours after a deployment, and while the testnet
      # node is down. That is not a broken submission and must not fail the branch; preflight
      # reports it PENDING, which is where it belongs. A genuinely dead link still exits 1.
      - name: check-explorer-links.sh
        run: |
          set +e
          ./scripts/check-explorer-links.sh
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::notice::evidence is on chain but not yet indexed by the explorer — re-run before opening the PR"
            exit 0
          fi
          exit "$status"

  criteria-summary:
    name: the criteria checklist agrees with itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The summary once claimed 10 criteria met while its own rows showed 19. A submission's
      # account of what it has done is the first thing a reviewer reads, and one that contradicts
      # the evidence beneath it reads as carelessness at best.
      - name: check-criteria-summary.py
        run: python3 scripts/check-criteria-summary.py

  basecamp-privacy:
    name: Basecamp UI must not leak member secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The generated UI persists "recent values" via QSettings. Harmless for a config hash,
      # catastrophic for the approval witness, which carries a member's spending key. This asserts
      # the property rather than trusting that the generator keeps skipping Vec<u8> fields.
      - name: check-basecamp-privacy.sh
        run: ./scripts/check-basecamp-privacy.sh

  basecamp-contract:
    name: the Basecamp module is actually wired to its backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The module shipped for a day looking complete and doing nothing: Basecamp renders a ui_qml
      # module's QML in its own process, so the context property the plugin set on its own engine
      # was never in scope and every binding raised "backend is not defined" behind a window that
      # drew perfectly. Nothing in the build noticed, because everything built. This asserts the
      # contract instead: the plugin publishes the API, and the QML resolves it through
      # logos.module() the way Basecamp's own modules do.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Quick Controls ships inside qtdeclarative from Qt 6 on; naming it as a module fails
          # with "packages ['qtquickcontrols2'] were not found while parsing XML".
          version: 6.9.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # libpcsclite: the wallet links pcsc-sys. The rest is what a Qt GUI binary needs to start
      # under the offscreen platform on a bare runner.
      - name: Install the module's build and run dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev libgl1 libegl1 libxkbcommon0 libfontconfig1
      - name: check-basecamp-contract.sh
        run: PMSIG_QT_DIR="$QT_ROOT_DIR" ./scripts/check-basecamp-contract.sh

  scripts-lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh $( [ -f demo.sh ] && echo demo.sh )

# Jobs added by later phases (tracked so their absence is visible, not forgotten):
#   preflight      — Phase H. Runs scripts/preflight-submission.sh, which exits 1 until every
#                    check passes; it is deliberately NOT wired yet because it must stay red
#                    until the submission packet is real.
#
# e2e-sequencer and explorer-links were on this list and are now real jobs above.
